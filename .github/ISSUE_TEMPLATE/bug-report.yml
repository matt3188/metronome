name: Report a bug
description: Tell us when something in Metronome is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Metronome better. Please share enough detail for us to reproduce the problem.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected to happen instead.
      placeholder: I expected… but instead…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the steps that caused the problem.
      placeholder: |
        1. Open…
        2. Tap…
        3. See…
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example, iPhone 15 with Safari or Windows 11 with Chrome.
      placeholder: Device, operating system, and browser
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Add screenshots or any other useful context here.
