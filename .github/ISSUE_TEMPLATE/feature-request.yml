name: Request a feature
description: Suggest an idea that would make Metronome more useful.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for sharing your idea for Metronome.
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the problem or goal behind your request.
      placeholder: It would help me if I could…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Metronome help?
      description: Describe the feature or experience you have in mind.
      placeholder: Metronome could…
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Add examples, sketches, or any other useful context here.
