name: Keep pull requests up to date

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: keep-prs-up-to-date
  cancel-in-progress: false

jobs:
  update:
    name: Merge main into open pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update pull request branches
        uses: actions/github-script@v7
        with:
          script: |
            const eventPullRequest = context.payload.pull_request
            const pullRequests = eventPullRequest
              ? [eventPullRequest]
              : await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  base: 'main',
                  per_page: 100,
                })

            const results = []

            for (const pullRequest of pullRequests) {
              if (pullRequest.base.ref !== 'main') continue

              if (pullRequest.draft) {
                results.push(`- #${pullRequest.number}: skipped (draft)`)
                continue
              }

              const comesFromFork = pullRequest.head.repo.full_name !== pullRequest.base.repo.full_name
              if (comesFromFork && !pullRequest.maintainer_can_modify) {
                results.push(`- #${pullRequest.number}: skipped (maintainer updates disabled)`)
                continue
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  expected_head_sha: pullRequest.head.sha,
                })
                results.push(`- #${pullRequest.number}: update requested`)
              } catch (error) {
                if (error.status !== 422) throw error

                // GitHub's update-branch endpoint refuses branches with conflicts.
                // For same-repository PRs, merge locally and consistently keep the
                // PR side of conflicting hunks. Non-conflicting main changes still
                // merge normally, and the validation workflow checks the result.
                if (comesFromFork) {
                  results.push(`- #${pullRequest.number}: cannot resolve conflicts in a fork`)
                  continue
                }

                await exec.exec('git', ['fetch', 'origin', 'main', pullRequest.head.sha])
                await exec.exec('git', ['checkout', '--detach', pullRequest.head.sha])

                const ancestry = await exec.getExecOutput(
                  'git',
                  ['merge-base', '--is-ancestor', 'origin/main', 'HEAD'],
                  { ignoreReturnCode: true },
                )
                if (ancestry.exitCode === 0) {
                  results.push(`- #${pullRequest.number}: already current`)
                  continue
                }

                await exec.exec('git', [
                  '-c', 'user.name=github-actions[bot]',
                  '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  'merge', '--no-edit', '-X', 'ours', 'origin/main',
                ])
                await exec.exec('git', [
                  'push',
                  'origin',
                  `HEAD:refs/heads/${pullRequest.head.ref}`,
                ])
                results.push(`- #${pullRequest.number}: conflicts resolved; PR version kept for overlapping hunks`)
              }
            }

            await core.summary
              .addHeading('Pull request branch updates')
              .addRaw(results.length > 0 ? results.join('\n') : 'No eligible pull requests found.')
              .write()
