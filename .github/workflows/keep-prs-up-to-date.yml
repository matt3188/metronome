name: Keep pull requests up to date

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: keep-prs-up-to-date
  cancel-in-progress: false

jobs:
  update:
    name: Merge main into open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update pull request branches
        uses: actions/github-script@v7
        with:
          script: |
            // Always sweep the complete queue. Limiting pull_request_target runs to
            // the event PR could leave older branches stale until the next cron run.
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            })

            const results = []
            const failures = []

            for (const pullRequest of pullRequests) {
              if (pullRequest.base.ref !== 'main') continue

              if (pullRequest.draft) {
                results.push(`- #${pullRequest.number}: skipped (draft)`)
                continue
              }

              const comesFromFork = pullRequest.head.repo.full_name !== pullRequest.base.repo.full_name
              if (comesFromFork && !pullRequest.maintainer_can_modify) {
                results.push(`- #${pullRequest.number}: skipped (maintainer updates disabled)`)
                continue
              }

              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  expected_head_sha: pullRequest.head.sha,
                })
                results.push(`- #${pullRequest.number}: update requested`)
              } catch (error) {
                if (error.status === 422) {
                  const refreshed = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                  })

                  // updateBranch cannot resolve conflicts. For branches in this
                  // repository, create the same merge locally and preserve the PR's
                  // side of conflicting hunks. Pull request validation runs again
                  // after the push and remains the authority on the merged result.
                  const canPushDirectly =
                    refreshed.data.head.repo.full_name === refreshed.data.base.repo.full_name
                  const hasConflict = refreshed.data.mergeable === false

                  if (canPushDirectly && hasConflict) {
                    const headRef = refreshed.data.head.ref
                    const headSha = refreshed.data.head.sha
                    const branch = `refs/heads/${headRef}`

                    await exec.exec('git', ['config', 'user.name', 'github-actions[bot]'])
                    await exec.exec('git', [
                      'config',
                      'user.email',
                      '41898282+github-actions[bot]@users.noreply.github.com',
                    ])
                    await exec.exec('git', ['fetch', '--no-tags', 'origin', branch])
                    await exec.exec('git', ['checkout', '--detach', 'FETCH_HEAD'])

                    const mergeExitCode = await exec.exec(
                      'git',
                      ['merge', '--no-edit', '-X', 'ours', 'origin/main'],
                      { ignoreReturnCode: true },
                    )

                    if (mergeExitCode !== 0) {
                      const { stdout } = await exec.getExecOutput(
                        'git',
                        ['diff', '--name-only', '--diff-filter=U', '-z'],
                        { ignoreReturnCode: true },
                      )
                      const conflictedPaths = stdout.split('\0').filter(Boolean)

                      if (conflictedPaths.length === 0) {
                        throw new Error('git merge failed without reporting conflicted files')
                      }

                      for (const path of conflictedPaths) {
                        const checkoutExitCode = await exec.exec(
                          'git',
                          ['checkout', '--ours', '--', path],
                          { ignoreReturnCode: true },
                        )
                        if (checkoutExitCode === 0) {
                          await exec.exec('git', ['add', '--', path])
                        } else {
                          await exec.exec('git', ['rm', '-f', '--ignore-unmatch', '--', path])
                        }
                      }

                      await exec.exec('git', ['commit', '--no-edit'])
                    }

                    await exec.exec('git', [
                      'push',
                      `--force-with-lease=${branch}:${headSha}`,
                      'origin',
                      `HEAD:${branch}`,
                    ])
                    results.push(`- #${pullRequest.number}: conflicts resolved and branch updated`)
                    continue
                  }

                  // The endpoint also uses 422 when no update is needed and for
                  // conflicting forks that this repository cannot safely push to.
                  const reason = error.response?.data?.message ?? error.message
                  results.push(`- #${pullRequest.number}: not updated (${reason})`)
                  continue
                }

                // Do not let one inaccessible or transiently broken branch prevent
                // every later PR from being processed.
                const reason = error.response?.data?.message ?? error.message
                failures.push(`#${pullRequest.number}: ${reason}`)
                results.push(`- #${pullRequest.number}: failed (${reason})`)
              }
            }

            await core.summary
              .addHeading('Pull request branch updates')
              .addRaw(results.length > 0 ? results.join('\n') : 'No eligible pull requests found.')
              .write()

            if (failures.length > 0) {
              core.setFailed(`Failed to update ${failures.length} pull request(s): ${failures.join('; ')}`)
            }
