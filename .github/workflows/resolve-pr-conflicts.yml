name: Resolve pull request conflicts

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: resolve-pr-conflicts
  cancel-in-progress: false

jobs:
  update:
    name: Update every open PR branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base branch automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]'])
            await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
            await exec.exec('git', ['fetch', '--no-tags', 'origin', '+refs/heads/main:refs/remotes/origin/main'])

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            })
            const results = []

            for (const pullRequest of pullRequests) {
              const label = `#${pullRequest.number}`
              if (pullRequest.head.repo?.id !== pullRequest.base.repo.id) {
                results.push(`- ${label}: skipped because its branch is in a fork`)
                continue
              }

              const trackingRef = `refs/remotes/origin/pr-${pullRequest.number}`
              const headRef = `+refs/heads/${pullRequest.head.ref}:${trackingRef}`

              try {
                await exec.exec('git', ['fetch', '--no-tags', 'origin', headRef])
                await exec.exec('git', ['checkout', '--detach', trackingRef])

                const current = await exec.getExecOutput(
                  'git',
                  ['merge-base', '--is-ancestor', 'origin/main', 'HEAD'],
                  { ignoreReturnCode: true },
                )
                if (current.exitCode === 0) {
                  results.push(`- ${label}: already current`)
                  continue
                }

                const merge = await exec.getExecOutput(
                  'git',
                  ['merge', '--no-edit', '-X', 'ours', 'origin/main'],
                  { ignoreReturnCode: true },
                )

                if (merge.exitCode !== 0) {
                  const unresolved = await exec.getExecOutput(
                    'git',
                    ['diff', '--name-only', '--diff-filter=U'],
                  )
                  const paths = unresolved.stdout.split('\n').filter(Boolean)
                  if (paths.length === 0) throw new Error('merge failed without unmerged paths')

                  for (const path of paths) {
                    const stages = await exec.getExecOutput('git', ['ls-files', '--stage', '--', path])
                    if (stages.stdout.split('\n').some((line) => / 2\t/.test(line))) {
                      await exec.exec('git', ['checkout', '--ours', '--', path])
                      await exec.exec('git', ['add', '--', path])
                    } else {
                      await exec.exec('git', ['rm', '-f', '--ignore-unmatch', '--', path])
                    }
                  }

                  await exec.exec('git', ['commit', '--no-edit'])
                }

                await exec.exec('git', [
                  'push',
                  'origin',
                  `HEAD:refs/heads/${pullRequest.head.ref}`,
                ])
                results.push(`- ${label}: updated; PR changes won overlapping conflicts`)
              } catch (error) {
                await exec.exec('git', ['merge', '--abort'], { ignoreReturnCode: true })
                results.push(`- ${label}: failed (${error.message})`)
                core.error(`${label}: ${error.stack ?? error.message}`)
              }
            }

            await core.summary
              .addHeading('Open pull request updates')
              .addRaw(results.length ? results.join('\n') : 'No open pull requests target main.')
              .write()
